server:
  port: 8081

app:
  market-data:
    api-key: ${MASSIVE_API_KEY:}
    base-url: ${MASSIVE_API_URL:https://api.massive.com}
  jwt:
    # Development-only fallback. Set PORTFOLIOPRO_JWT_SECRET to a long random value outside local development.
    secret: ${PORTFOLIOPRO_JWT_SECRET:PortfolioPro-Local-Development-Secret-Key-Change-Me}
    expiration-ms: 3600000

spring:
  application:
    name: portfoliopro-backend

  datasource:
    url: jdbc:h2:mem:portfoliopro;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password: ""

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

        jdbc:
          time_zone: UTC
  flyway:
    enabled: false

logging:
  level:
    com.portfoliopro: DEBUG
