spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/portfolio_pro}
    username: ${DB_USERNAME:portfolio_app}
    password: ${DB_PASSWORD}

  h2:
    console:
      enabled: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    open-in-view: false

    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true


    locations: classpath:db/migration
    validate-on-migrate: true
    clean-disabled: true