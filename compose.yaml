services:
  postgres:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-portfolio_pro}
      POSTGRES_USER: ${DB_USERNAME:-portfolio_app}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-portfolio_local_only}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - portfolio_pro_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build:
      context: ./portfoliopro-backend
    restart: unless-stopped
    environment:
      SPRING_PROFILES_ACTIVE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/${DB_NAME:-portfolio_pro}
      DB_NAME: ${DB_NAME:-portfolio_pro}
      DB_USERNAME: ${DB_USERNAME:-portfolio_app}
      DB_PASSWORD: ${DB_PASSWORD:-portfolio_local_only}
      PORTFOLIOPRO_JWT_SECRET: ${PORTFOLIOPRO_JWT_SECRET:-PortfolioPro-Local-Docker-Secret-Change-Before-Use}
      MASSIVE_API_KEY: ${MASSIVE_API_KEY:-}
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8081/api/health >/dev/null || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 40s

  frontend:
    build:
      context: ./portfolio-frontend
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  portfolio_pro_postgres:
